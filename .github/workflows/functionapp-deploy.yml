name: Deploy Function App

on:

  push:

    branches:
      - main

    paths:
      - "src/function-app/**"

jobs:

  deploy:

    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:

      - name: Checkout

        uses: actions/checkout@v4

      - name: Azure Login

        uses: azure/login@v2

        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Python

        uses: actions/setup-python@v5

        with:
          python-version: "3.12"

      - name: Install Dependencies

        run: |

          cd src/function-app

          pip install \
          -r requirements.txt

      - name: Deploy Function

        uses: Azure/functions-action@v1

        with:
          app-name: func-tdip-dev

          package: src/function-app