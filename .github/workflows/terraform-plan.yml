name: Terraform Plan

on:
	pull_request:
		paths:
			- "environments/dev/**"
			- "modules/**"
			- ".github/workflows/terraform-plan.yml"

permissions:
	contents: read
	id-token: write

jobs:
	plan:
		runs-on: ubuntu-latest
		environment: dev
		env:
			ARM_USE_OIDC: true
			ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
			ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
			ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
			TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
			TF_VAR_name_suffix: ${{ vars.TF_NAME_SUFFIX }}
		defaults:
			run:
				working-directory: environments/dev
		steps:
			- uses: actions/checkout@v4
			- uses: azure/login@v2
				with:
					client-id: ${{ vars.AZURE_CLIENT_ID }}
					tenant-id: ${{ vars.AZURE_TENANT_ID }}
					subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
			- uses: hashicorp/setup-terraform@v3
				with:
					terraform_version: "1.9.8"
			- name: Check formatting
				working-directory: .
				run: terraform fmt -check -recursive
			- name: Initialize backend
				run: >-
					terraform init -input=false
					-backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}"
					-backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}"
					-backend-config="container_name=tfstate"
					-backend-config="key=terraform-drift/dev.tfstate"
					-backend-config="use_azuread_auth=true"
			- name: Validate
				run: terraform validate
			- name: Plan
				run: terraform plan -input=false -no-color
