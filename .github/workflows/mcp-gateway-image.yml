name: MCP Gateway Image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Container image tag to publish
        required: true
        default: v1

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: dev
    env:
      IMAGE_TAG: ${{ inputs.image_tag }}
    defaults:
      run:
        working-directory: environments/dev
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Initialize backend
        run: >-
          terraform init -input=false
          -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}"
          -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}"
          -backend-config="container_name=tfstate"
          -backend-config="key=terraform-drift/dev.tfstate"
          -backend-config="use_azuread_auth=true"

      - name: Read deployment outputs
        run: |
          echo "RESOURCE_GROUP=$(terraform output -raw resource_group_name)" >> "$GITHUB_ENV"
          echo "ACR_NAME=$(terraform output -raw mcp_gateway_acr_name)" >> "$GITHUB_ENV"
          echo "ACR_SERVER=$(terraform output -raw mcp_gateway_acr_login_server)" >> "$GITHUB_ENV"
          echo "APP_NAME=$(terraform output -raw mcp_gateway_container_app_name)" >> "$GITHUB_ENV"
          echo "GATEWAY_URL=$(terraform output -raw mcp_gateway_url)" >> "$GITHUB_ENV"

      - name: Build and push gateway image
        working-directory: ${{ github.workspace }}
        run: |
          IMAGE="$ACR_SERVER/mcp-gateway:$IMAGE_TAG"
          az acr login --name "$ACR_NAME"
          docker build \
            --file src/mcp/activity-log-mcp/Dockerfile \
            --tag "$IMAGE" \
            src/mcp
          docker push "$IMAGE"

      - name: Configure managed-identity pull and update the app
        run: |
          IMAGE="$ACR_SERVER/mcp-gateway:$IMAGE_TAG"
          az containerapp registry set \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --server "$ACR_SERVER" \
            --identity system
          az containerapp update \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$IMAGE" \
            --command uvicorn \
            --args server:app --host 0.0.0.0 --port 8000
          curl --fail --retry 10 --retry-delay 15 --retry-all-errors "$GATEWAY_URL/health"
