name: MCP Gateway Image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Container image tag to publish
        required: true
        default: v1
      RESOURCE_GROUP:
        description: Azure Resource Group name
        required: true
        default: defaultresourcegroup-wus3
      ACR_NAME:
        description: Azure Container Registry name
        required: true
        default: csg100320031401b3a8
      ACR_SERVER:
        description: Azure Container Registry login server
        required: true
        default: csg100320031401b3a8.azurecr.io
      APP_NAME:
        description: Azure Container App name
        required: true
        default: mcp-gateway-container-app-dev
      GATEWAY_URL:
        description: Azure Container App URL
        required: true
        default: https://mcp-gateway-container-app-dev.wus3.azurecontainerapps.io

permissions:
  contents: read
  id-token: write

env:
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_USE_OIDC: true
  TFSTATE_RESOURCE_GROUP: 'defaultresourcegroup-wus3'
  TFSTATE_STORAGE_ACCOUNT: 'csg100320031401b3a8'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: dev
    env:
      IMAGE_TAG: ${{ inputs.image_tag }}
      RESOURCE_GROUP: ${{ inputs.RESOURCE_GROUP }}
      ACR_NAME: ${{ inputs.ACR_NAME }}
      ACR_SERVER: ${{ inputs.ACR_SERVER }}
      APP_NAME: ${{ inputs.APP_NAME }}
      GATEWAY_URL: ${{ inputs.GATEWAY_URL }}
    defaults:
      run:
        working-directory: environments/dev
    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push gateway image
        working-directory: ${{ github.workspace }}
        run: |
          IMAGE="$ACR_SERVER/mcp-gateway:$IMAGE_TAG"
          az acr login --name "$ACR_NAME"
          docker build \
            --file src/mcp/activity-log-mcp/Dockerfile \
            --tag "$IMAGE" \
            src/mcp
          docker push "$IMAGE"

      - name: Configure managed-identity pull and update the app
        run: |
          IMAGE="$ACR_SERVER/mcp-gateway:$IMAGE_TAG"
          az containerapp registry set \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --server "$ACR_SERVER" \
            --identity system
          az containerapp update \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$IMAGE" \
            --command "" \
            --args ""
          curl --fail --retry 10 --retry-delay 15 --retry-all-errors "$GATEWAY_URL/health"

